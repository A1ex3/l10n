name: CI

on:
  push:
    branches:
      - '*'
    paths-ignore:
      - 'LICENSE'
      - 'README.md'
  pull_request:
    branches:
      - '*'
    paths-ignore:
      - 'LICENSE'
      - 'README.md'

env:
  CHANGELOG_FILE: changelog.txt

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ matrix.os }}
          repository-cache: true

      - name: Check BUILD files and MODULE.bazel are up to date
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          bazel run //:gazelle
          bazel mod tidy
          git diff --exit-code

      - name: Run tests
        shell: bash
        run: bazel test //...

  release:
    name: Create release
    needs: test
    if: ${{ needs.test.result == 'success' && startsWith(github.ref, 'refs/heads/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-release
          repository-cache: true

      - name: Write version to environment variables
        shell: bash
        run: echo "L10N_INFO_VERSION=$(.ci/get_proj_data.sh -version)" >> "$GITHUB_ENV"

      - name: Build for all platforms
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          TARGET=//cmd/l10n:l10n
          for plat in linux_amd64 darwin_arm64 windows_amd64; do
            FLAGS=(
              "--platforms=@rules_go//go/toolchain:${plat}"
              "--@rules_go//go/config:pure"
            )
            bazel build "${FLAGS[@]}" "$TARGET"
            SRC=$(bazel cquery "${FLAGS[@]}" --output=files "$TARGET" 2>/dev/null)
            EXT=""
            [[ "$plat" == windows_* ]] && EXT=".exe"
            cp "$SRC" "dist/l10n_${plat}${EXT}"
          done
          ls -l dist

      - name: Get change log
        shell: bash
        run: |
          chmod +x .ci/get_changelog.sh
          ./.ci/get_changelog.sh "${CHANGELOG_FILE}" "${L10N_INFO_VERSION}" > "${CHANGELOG_FILE}.tmp"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ env.CHANGELOG_FILE }}.tmp
          files: dist/*
          tag_name: ${{ env.L10N_INFO_VERSION }}
          token: ${{ secrets.ACTIONS }}