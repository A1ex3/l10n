name: CI

on:
  push:
    branches:
      - '*'
    paths-ignore:
      - 'LICENSE'
      - 'README.md'
  pull_request:
    branches:
      - '*'
    paths-ignore:
      - 'LICENSE'
      - 'README.md'

env:
  CHANGELOG_FILE: changelog.txt
  APP_INFO_FILE: appinfo

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        go-version: ['1.20', '1.21']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Run tests
        shell: bash
        run: make test

  release:
    name: Create release
    needs: test
    if: ${{ needs.test.result == 'success' && startsWith(github.ref, 'refs/heads/v') }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    
    env:
      BUILD_PATH: build/l10n

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Write appinfo data to environment variables
        shell: bash
        run: |
            source ${{env.APP_INFO_FILE}}
            echo "L10N_INFO_VERSION=${L10N_INFO_VERSION}" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build
        shell: bash
        run: make build

      - name: Get Change log
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'macos-latest'
        shell: bash
        run: |
          sudo chmod +x .ci/get_changelog.sh
          ./.ci/get_changelog.sh ${{env.CHANGELOG_FILE}} ${{env.L10N_INFO_VERSION}} > ${{ env.CHANGELOG_FILE }}.tmp

      - name: Rename built program
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
            mv ${{env.BUILD_PATH}}.exe ${{env.BUILD_PATH}}_windows.exe
            echo "BUILD_PATH=${{env.BUILD_PATH}}_windows.exe" >> $GITHUB_ENV

      - name: Rename built program
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
            mv ${{env.BUILD_PATH}} ${{env.BUILD_PATH}}_linux
            echo "BUILD_PATH=${{env.BUILD_PATH}}_linux" >> $GITHUB_ENV

      - name: Rename built program
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
            mv ${{env.BUILD_PATH}} ${{env.BUILD_PATH}}_macos
            echo "BUILD_PATH=${{env.BUILD_PATH}}_macos" >> $GITHUB_ENV

      - name: Create GitHub Release (Windows)
        if: matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
            files: ${{env.BUILD_PATH}}
            tag_name: ${{env.L10N_INFO_VERSION}}
        env:
            GITHUB_TOKEN: ${{ secrets.ACTIONS }}

      - name: Create GitHub Release (Linux & macOS)
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'macos-latest'
        uses: softprops/action-gh-release@v2
        with:
            body_path: ${{ env.CHANGELOG_FILE }}.tmp
            files: ${{env.BUILD_PATH}}
            tag_name: ${{env.L10N_INFO_VERSION}}
        env:
            GITHUB_TOKEN: ${{ secrets.ACTIONS }}
